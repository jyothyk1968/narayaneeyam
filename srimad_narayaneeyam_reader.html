            mal: "നൂനം തത്ത്വാവിചാരാത് പഥി പഥി നിയതാഃ കർമ്മപാശാന്വിതാനാം\nദുഃഖം ദൂരീകരോതീത്യുദിതമപി തഥാ ചൈകമാസ്ത്യേവ ലോക്കേ\nത്വദ്ധ്യാനം ത്വത്പ്രഭാവശ്രവണഗുണപരീവർത്തനാന്യാദരാദ്യൈഃ\nകുർവദ്ഭിർഭാഗ്യഭാദ്ഭിഃ സുഗമതരതയാ മുക്തിരാസൂയതേഽപി",

            meaning: "കർമ്മബന്ധങ്ങളിൽ കുരുങ്ങിക്കിടക്കുന്ന സംസാരികൾക്ക് തത്ത്വവിചാരമെന്ന ജ്ഞാനമാർഗ്ഗം അത്യന്തം ദുഷ്കരമാണ്. എന്നാൽ അങ്ങയെ ധ്യാനിക്കുകയും, അങ്ങയുടെ ലീലകളും മാഹാത്മ്യങ്ങളും ഭക്തിപൂർവ്വം ശ്രവിക്കുകയും, നാമസങ്കീർത്തനം ചെയ്യുകയും ചെയ്യുന്ന സുകൃതികൾക്ക് അനായാസേന മുക്തി പദവി കൈവരുന്നു."
          },
          {
            num: 4,
            mal: "ശ്രീമൻ! ധന്യോഽസി സർവ്വേശ്വര! തവ ച വപുർവിശ്വപാവനമാസ്തേ\nസത്യം ജ്ഞാനസ്വരൂപം വിഭവഗുണനിധിർഭക്തിഗമ്യം പ്രസന്നം\nഭക്താനാമാർത്തീഹാരീ ഭവഭയദമനഃ ശംസുഖാഭീഷ്ടദായീ\nതസ്മിൻ മേ ചിത്തവൃത്തിർവിഗതമലതയാ വർദ്ധതാം നിത്യകാലമ്",

          {
            num: 5,

          {

          {

    /* -------------------------------------------------------------
       2. APPLICATION STATE
    ------------------------------------------------------------- */
    let currentDashakamId = 1;
    let currentScript = 'mal'; // 'mal' | 'dev' | 'eng'
    let showMeaning = true;
    let baseFontSize = 18; // px for verses

    /* -------------------------------------------------------------
       3. INITIALIZATION
    ------------------------------------------------------------- */
    window.onload = function() {
      buildSidebarList();
      loadDashakam(1);
      setupAudioPlayer();
      lucide.createIcons();
    };

    /* -------------------------------------------------------------
       4. SIDEBAR DIRECTORY LOGIC
    ------------------------------------------------------------- */
    function buildSidebarList(filterText = "") {
      const container = document.getElementById("dashakamListContainer");
      container.innerHTML = "";
      const query = filterText.toLowerCase().trim();

      DASHAKAMS_META.forEach(item => {
        const matches = (
          item.id.toString().includes(query) ||
          item.title_mal.toLowerCase().includes(query) ||
          item.title_dev.toLowerCase().includes(query) ||
          item.title_eng.toLowerCase().includes(query)
        );

        if (!matches) return;

        const isCurrent = item.id === currentDashakamId;
        const btn = document.createElement("button");
        btn.onclick = () => {
          loadDashakam(item.id);
          if (window.innerWidth < 1024) toggleSidebar(false);
        };
        btn.className = `w-full text-left px-3 py-2.5 rounded-xl transition-all flex items-center justify-between text-xs sm:text-sm ${
          isCurrent 
            ? "bg-maroon-800 text-white font-semibold shadow-sm" 
            : "hover:bg-amber-100/60 text-stone-800"
        }`;

        let titleDisplay = item.title_mal;
        if (currentScript === 'dev') titleDisplay = item.title_dev;
        if (currentScript === 'eng') titleDisplay = item.title_eng;

        btn.innerHTML = `
          <div class="flex items-center gap-2.5 truncate">
            <span class="w-6 h-6 rounded-md flex items-center justify-center font-mono text-xs ${
              isCurrent ? "bg-amber-400 text-maroon-900 font-bold" : "bg-[#E6DBCE] text-stone-700"
            }">${item.id}</span>
            <span class="truncate">${titleDisplay}</span>
          </div>
          <i data-lucide="chevron-right" class="w-3.5 h-3.5 opacity-60"></i>
        `;
        container.appendChild(btn);
      });
      lucide.createIcons();
    }

    function filterDashakamList() {
      const q = document.getElementById("dashakamSearch").value;
      buildSidebarList(q);
    }

    function toggleSidebar(open) {
      const sb = document.getElementById("sidebar");
      const backdrop = document.getElementById("drawerBackdrop");
      if (open) {
        sb.classList.remove("-translate-x-full");
        backdrop.classList.remove("hidden");
      } else {
        sb.classList.add("-translate-x-full");
        backdrop.classList.add("hidden");
      }
    }

    /* -------------------------------------------------------------
       5. CONTENT LOADER & RENDERER
    ------------------------------------------------------------- */
    function loadDashakam(id) {
      if (id < 1 || id > 100) return;
      currentDashakamId = id;

      // Update titles
      const meta = DASHAKAMS_META.find(d => d.id === id) || { id, title_mal: `ദശകം ${id}`, title_dev: `दशकम् ${id}`, title_eng: `Dashakam ${id}` };
      
      const badge = document.getElementById("dashakamNumberBadge");
      badge.textContent = `ദശകം | Dashakam ${id} of 100`;

      const titleMain = document.getElementById("dashakamTitleMain");
      const titleSub = document.getElementById("dashakamTitleSub");
      const desc = document.getElementById("dashakamDescription");

      if (currentScript === 'mal') {
        titleMain.textContent = `${meta.id}. ${meta.title_mal}`;
        titleSub.textContent = meta.title_dev;
      } else if (currentScript === 'dev') {
        titleMain.textContent = `${meta.id}. ${meta.title_dev}`;
        titleSub.textContent = meta.title_mal;
      } else {
        titleMain.textContent = `${meta.id}. ${meta.title_eng}`;
        titleSub.textContent = meta.title_mal;
      }

      const content = DASHAKAM_CONTENT[id];
      desc.textContent = (content && content.description) 
        ? content.description 
        : `Devotional composition of Dashakam ${id}. Full slokas and meanings can be viewed across Malayalam, Devanagari, and English.`;

      // Update Audio Player source
      const audioEl = document.getElementById("audioElement");
      const audioLabel = document.getElementById("audioTrackLabel");
      if (content && content.audio) {
        audioEl.src = content.audio;
        audioLabel.textContent = `Dashakam ${id} Audio Chanting`;
      } else {
        // Fallback default audio source
        audioEl.src = `https://ia800300.us.archive.org/28/items/Narayaneeyam-Malayalam/Narayaneeyam_D${id}.mp3`;
        audioLabel.textContent = `Dashakam ${id} Audio (Archive.org chant)`;
      }
      resetAudioState();

      // Render Slokas
      renderSlokas(id);

      // Refresh sidebar active highlight
      buildSidebarList(document.getElementById("dashakamSearch").value);

      // Scroll smoothly to top
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function renderSlokas(id) {
      const container = document.getElementById("slokasContainer");
      container.innerHTML = "";

      const dashakamData = DASHAKAM_CONTENT[id];

      // If content is present, render real verses
      if (dashakamData && dashakamData.verses && dashakamData.verses.length > 0) {
        dashakamData.verses.forEach(verse => {
          const card = createVerseCard(verse);
          container.appendChild(card);
        });
      } else {
        // Helpful placeholder structure if a specific middle dashakam is not yet populated
        const notice = document.createElement("div");
        notice.className = "bg-amber-50 border border-amber-200/80 p-6 rounded-2xl text-center space-y-3";
        notice.innerHTML = `
          <div class="w-10 h-10 mx-auto bg-amber-100 text-maroon-800 rounded-full flex items-center justify-center">
            <i data-lucide="feather" class="w-5 h-5"></i>
          </div>
          <h4 class="font-bold text-maroon-900 font-header text-base">ദശകം ${id} - ടെക്സ്റ്റ് തയ്യാറാകുന്നു</h4>
          <p class="text-xs sm:text-sm text-stone-600 max-w-lg mx-auto leading-relaxed">
            Dashakam 1, 2, and 100 are fully preloaded with real Malayalam, Devanagari, English transliteration, and meanings.
            You can drop JSON files or paste verses directly into the <code class="bg-amber-100 px-1.5 py-0.5 rounded text-maroon-900">DASHAKAM_CONTENT[${id}]</code> object in this single file.
          </p>
          <div class="pt-2">
            <button onclick="loadDashakam(1)" class="px-4 py-2 bg-maroon-800 text-white rounded-lg text-xs font-semibold hover:bg-maroon-900 transition">
              View Sample Dashakam 1
            </button>
          </div>
        `;
        container.appendChild(notice);
      }

      lucide.createIcons();
    }

    function createVerseCard(verse) {
      const card = document.createElement("article");
      card.className = "bg-white border border-[#E9DFD2] rounded-2xl p-5 sm:p-7 shadow-sm transition-all hover:shadow-md relative overflow-hidden";

      // Verse script picker
      let textContent = "";
      let fontClass = "font-malayalam";

      if (currentScript === 'mal') {
        textContent = verse.mal;
        fontClass = "font-malayalam";
      } else if (currentScript === 'dev') {
        textContent = verse.dev;
        fontClass = "font-devanagari";
      } else {
        textContent = verse.eng;
        fontClass = "font-translit";
      }

      // Convert line breaks safely
      const formattedLines = textContent.split('\n').join('<br>');

      card.innerHTML = `
        <div class="flex items-center justify-between border-b border-stone-150 pb-3 mb-4">
          <span class="inline-flex items-center gap-1.5 text-xs font-bold text-maroon-900 font-mono bg-stone-100 px-2.5 py-1 rounded-md border border-stone-200">
            <i data-lucide="bookmark" class="w-3.5 h-3.5 text-amber-600"></i>
            Verse ${verse.num}
          </span>
          <div class="flex items-center gap-2">
            <button onclick="copyVerseText('${verse.num}')" class="text-stone-400 hover:text-stone-700 p-1 transition" title="Copy Verse">
              <i data-lucide="copy" class="w-4 h-4"></i>
            </button>
          </div>
        </div>

        <!-- Sloka Display -->
        <div id="verse-text-${verse.num}" class="${fontClass} font-semibold text-stone-900 verse-line text-center sm:text-left mb-4" style="font-size: ${baseFontSize}px;">
          ${formattedLines}
        </div>

        <!-- Word-by-Word / English & Malayalam Meaning -->
        <div class="meaning-block ${showMeaning ? 'block' : 'hidden'} mt-4 pt-4 border-t border-[#F2ECE3] bg-[#FCFAF7] -mx-5 -mb-5 sm:-mx-7 sm:-mb-7 p-4 sm:p-5 rounded-b-2xl">
          <div class="flex items-center gap-1.5 text-xs font-semibold text-stone-700 mb-1.5 uppercase tracking-wider">
            <i data-lucide="info" class="w-3.5 h-3.5 text-maroon-800"></i>
            <span class="font-malayalam">മലയാള അർത്ഥം:</span>
          </div>
          <p class="text-xs sm:text-sm text-stone-700 leading-relaxed font-malayalam">
            ${verse.meaning || "ഈ ശ്ലോകത്തിന്റെ വ്യാഖ്യാനം ഉടൻ ലഭ്യമാകുന്നതാണ്."}
          </p>
        </div>
      `;

      return card;
    }

    /* -------------------------------------------------------------
       6. SCRIPT SWITCHER & CONTROLS
    ------------------------------------------------------------- */
    function setScript(scriptKey) {
      currentScript = scriptKey;

      // Update button styling
      ['mal', 'dev', 'eng'].forEach(k => {
        const btn = document.getElementById(`btn-${k}`);
        if (k === scriptKey) {
          btn.className = "px-2.5 py-1 rounded-md font-medium transition-all bg-maroon-800 text-white shadow-sm";
        } else {
          btn.className = "px-2.5 py-1 rounded-md font-medium text-stone-700 transition-all hover:text-black";
        }
      });

      // Reload view with new script
      loadDashakam(currentDashakamId);
    }

    function toggleMeaning() {
      showMeaning = !showMeaning;
      const desktopText = document.getElementById("meaningBtnText");
      const mobileText = document.getElementById("mobileMeaningToggleText");
      const label = showMeaning ? "അർത്ഥം മറയ്ക്കുക" : "അർത്ഥം കാണിക്കുക";
      if (desktopText) desktopText.textContent = label;
      if (mobileText) mobileText.textContent = label;

      // Toggle visibility of all cards
      document.querySelectorAll(".meaning-block").forEach(el => {
        if (showMeaning) {
          el.classList.remove("hidden");
        } else {
          el.classList.add("hidden");
        }
      });
    }

    function adjustFontSize(delta) {
      baseFontSize = Math.min(Math.max(14, baseFontSize + (delta * 2)), 32);
      document.querySelectorAll("[id^='verse-text-']").forEach(el => {
        el.style.fontSize = `${baseFontSize}px`;
      });
    }

    function navigateDashakam(step) {
      const target = currentDashakamId + step;
      if (target >= 1 && target <= 100) {
        loadDashakam(target);
      }
    }

    /* -------------------------------------------------------------
       7. AUDIO PLAYER LOGIC
    ------------------------------------------------------------- */
    const audio = document.getElementById("audioElement");
    const playBtn = document.getElementById("playAudioBtn");
    const playIcon = document.getElementById("playIcon");
    const seeker = document.getElementById("audioSeeker");
    const currentTimeEl = document.getElementById("audioCurrentTime");
    const durationEl = document.getElementById("audioDuration");
    const speedBtn = document.getElementById("speedBtn");

    function setupAudioPlayer() {
      audio.addEventListener("timeupdate", () => {
        if (!isNaN(audio.duration)) {
          seeker.value = (audio.currentTime / audio.duration) * 100;
          currentTimeEl.textContent = formatTime(audio.currentTime);
          durationEl.textContent = formatTime(audio.duration);
        }
      });

      audio.addEventListener("loadedmetadata", () => {
        durationEl.textContent = formatTime(audio.duration);
      });

      audio.addEventListener("ended", () => {
        resetAudioState();
      });

      audio.addEventListener("error", () => {
        // Soft fallback for placeholder tracks
        audioLabel = document.getElementById("audioTrackLabel");
        audioLabel.textContent = `Dashakam ${currentDashakamId} (Add your MP3 URL)`;
      });

      seeker.addEventListener("input", () => {
        if (!isNaN(audio.duration)) {
          audio.currentTime = (seeker.value / 100) * audio.duration;
        }
      });
    }

    function toggleAudio() {
      if (audio.paused) {
        audio.play().then(() => {
          playIcon.setAttribute("data-lucide", "pause");
          lucide.createIcons();
        }).catch(err => {
          showToast("Audio file loading or configure custom audio link.");
        });
      } else {
        audio.pause();
        playIcon.setAttribute("data-lucide", "play");
        lucide.createIcons();
      }
    }

    function resetAudioState() {
      audio.pause();
      audio.currentTime = 0;
      seeker.value = 0;
      currentTimeEl.textContent = "0:00";
      playIcon.setAttribute("data-lucide", "play");
      lucide.createIcons();
    }

    function cycleSpeed() {
      const speeds = [1.0, 1.25, 0.8];
      let nextSpeed = speeds[(speeds.indexOf(audio.playbackRate) + 1) % speeds.length];
      audio.playbackRate = nextSpeed;
      speedBtn.textContent = `${nextSpeed}x`;
    }

    function formatTime(sec) {
      if (isNaN(sec)) return "0:00";
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return `${m}:${s < 10 ? '0' : ''}${s}`;
    }

    /* -------------------------------------------------------------
       8. UTILITIES (Copy & Toast)
    ------------------------------------------------------------- */
    function showToast(msg) {
      const toast = document.getElementById("toast");
      document.getElementById("toastMessage").textContent = msg;
      toast.classList.remove("translate-y-20", "opacity-0");
      setTimeout(() => {
        toast.classList.add("translate-y-20", "opacity-0");
      }, 2600);
    }

    function copyDashakamLink() {
      const url = window.location.href.split('#')[0] + `#dashakam-${currentDashakamId}`;
      fallbackCopyText(url);
      showToast(`Link to Dashakam ${currentDashakamId} copied!`);
    }

    function copyVerseText(verseNum) {
      const textElem = document.getElementById(`verse-text-${verseNum}`);
      if (textElem) {
        fallbackCopyText(textElem.innerText);
        showToast(`Verse ${verseNum} copied to clipboard!`);
      }
    }

    function fallbackCopyText(text) {
      const textArea = document.createElement("textarea");
      textArea.value = text;
      textArea.style.position = "fixed";
      textArea.style.left = "-9999px";
      document.body.appendChild(textArea);
      textArea.focus();
      textArea.select();
      try {
        document.execCommand('copy');
      } catch (err) {
        console.error('Unable to copy', err);
      }
      document.body.removeChild(textArea);
    }
  </script>
</body>
</html>
